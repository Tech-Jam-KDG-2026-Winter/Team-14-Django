{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Habitree</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* 修正ポイント：urlの内容をDjangoのstaticタグに変更 */
            background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)), 
                        url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
        }

        .error-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        /* --- 以下、アニメーション等のスタイルはそのまま --- */
        .animation-box {
            height: 120px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .error-code {
            font-size: 5rem;
            font-weight: bold;
            color: #76b852;
            display: flex;
            gap: 0;
        }

        .error-code span {
            display: inline-block;
            animation: wave 2s infinite ease-in-out;
        }
        .error-code span:nth-child(2) { animation-delay: 0.2s; }
        .error-code span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .error-message {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 30px;
        }

        .btn-home {
            background-color: #c4e89b;
            border: none;
            color: #000;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-home:hover {
            background-color: #fff;
            box-shadow: 0 0 0 2px #a2d572 inset;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="animation-box">
        <div class="error-code">
            <span>4</span><span>0</span><span>4</span>
        </div>
    </div>
    
    <p class="error-message">
        この場所には何も植えられていないようです。
    </p>
    
    <a href="{% url 'home' %}" class="btn-home">ホームへ戻る</a>
</div>

</body>
</html>
