{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - Habitree</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            background: linear-gradient(to bottom, #e0ffff 0%, #ffffff 85%);
        }

        /* --- PC版レイアウト --- */
        .top-nav {
            display: flex;
            height: 120px;
            position: relative;
            z-index: 10;
        }

        .task-area {
            background-color: #a8d59d;
            flex-grow: 1;
            display: flex;
            padding: 20px;
            gap: 40px;
        }

        .task-column h3 {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .task-list {
            list-style: none;
            padding: 0;
            font-size: 0.9rem;
        }

        .task-list li {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-area {
            background-color: #76b852;
            width: 350px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: white;
        }

        .nav-item {
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: opacity 0.2s;
        }
        .nav-item:hover {
            opacity: 0.8;
            color: #e0ffff;
        }

        .nav-item .material-symbols-outlined {
            font-size: 2.5rem;
            display: block;
        }

        .nav-item span {
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* 植物エリア */
        .plant-container {
            position: absolute;
            bottom: -100px; /* 画像に合わせて調整してください */
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 1;
        }

        .plant-img {
            width: 80%;
            max-width: 500px;
            height: auto;
            vertical-align: bottom;
        }

        /* チェックボックスのスタイル調整（クリックしやすく） */
        .task-checkbox {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        /* --- スマホ版レスポンシブ (768px以下) --- */
        @media (max-width: 767px) {
            .top-nav {
                flex-direction: column;
                height: auto;
            }

            /* タスクエリアを上部に広げる */
            .task-area {
                height: 45vh;
                flex-direction: column;
                padding: 30px;
                gap: 3px;
            }

            .task-column h3 {
                font-size: 1.2rem;
            }

            .task-list {
                font-size: 1.1rem;
            }

            /* メニューエリアを画面下部に固定 */
            .menu-area {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 100px;
                z-index: 20;
            }

            .plant-container {
                bottom: 80px; /* メニューバーの上に配置 */
                width: 100%;
                bottom: -14px; /* 画像に合わせて調整してください */
            }
            
            .plant-img {
                width: 270px;
            }
        }
    </style>
</head>
<body>

<header class="top-nav">
    <div class="task-area">
        <div class="task-column">
            <h3>デイリータスク: </h3>
        </div>
        <div class="task-column">
            <ul class="task-list">
                {% for task in daily_tasks %}
                <li>
                    <input type="checkbox" class="task-checkbox" id="task-{{ task.id }}" {% if task.is_completed %}checked{% endif %}>
                    <label for="task-{{ task.id }}">{{ task.title }}</label>
                </li>
                {% empty %}
                <li>今日のタスクはまだありません</li>
                {% endfor %}
            </ul>
        </div>

        <div class="task-column">
            <h3>ウィークリータスク: </h3>
        </div>
        <div class="task-column">
            <ul class="task-list">
                {% for task in weekly_tasks %}
                <li>
                    <input type="checkbox" class="task-checkbox" id="task-{{ task.id }}" {% if task.is_completed %}checked{% endif %}>
                    <label for="task-{{ task.id }}">{{ task.title }}</label>
                </li>
                {% empty %}
                <li>今週のタスクはまだありません</li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <nav class="menu-area">
        <a href="{% url 'home' %}" class="nav-item">
            <span class="material-symbols-outlined">home</span>
            <span>ホーム</span>
        </a>
        <a href="{% url 'mypage' %}" class="nav-item">
            <span class="material-symbols-outlined">person</span>
            <span>マイページ</span>
        </a>
        <a href="{% url 'list_edit' %}" class="nav-item">
            <span class="material-symbols-outlined">view_list</span>
            <span>リスト編集</span>
        </a>
    </nav>
</header>

<div class="plant-container">
    <img src="{% static 'img/Tree_growth_stage/' %}{{ tree_image|default:'t4.png' }}" alt="植物" class="plant-img">
</div>

<script>
    document.querySelectorAll('.task-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            console.log('Task ID:', this.id, 'Changed to:', this.checked);
            // ここに fetch() を書いてサーバーに完了を通知します
            // 明日の発表で「動いてる感」を出すだけなら、このままでもOKです！
        });
    });
</script>

</body>
</html>
