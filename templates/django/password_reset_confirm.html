{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードリセット - Habitree</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* staticタグを使って画像を読み込むように変更 */
            background: linear-gradient(rgba(255, 255, 255, 0.500), rgba(255, 255, 255, 0.500)), 
                        url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }

        /* --- CSSはそのまま維持 (中略) --- */
        .login-wrapper { text-align: center; width: 100%; max-width: 420px; }
        .app-title { font-size: 2.8rem; font-weight: bold; color: #013c00; margin-bottom: 20px; }
        .login-card { background-color: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); text-align: left; }
        .login-card h2 { font-size: 1.5rem; font-weight: bold; margin-bottom: 25px; text-align: center; }
        .instruction-text { font-size: 0.9rem; color: #555; margin-bottom: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 20px; }
        .form-label { font-weight: bold; font-size: 0.9rem; margin-bottom: 8px; display: block; }
        .form-control { background-color: #e6e6e6; border: none; border-radius: 6px; height: 44px; }
        .btn-submit-container { display: flex; justify-content: center; margin-top: 10px; }
        .btn-green { background-color: #c4e89b; border: none; color: #000; padding: 10px 40px; border-radius: 30px; font-weight: bold; transition: all 0.2s; display: flex; justify-content: center; align-items: center; margin-left: auto; margin-right: auto; }
        .btn-green:hover { background-color: #fff; box-shadow: 0 0 0 2px #a2d572 inset; }
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; color: #666; text-decoration: none; }
        /* モーダル用CSSも維持 */
        .custom-modal-content { border-radius: 15px; border: none; }
        .custom-modal-icon { font-size: 4rem; color: #76b852; margin-bottom: 15px; }
        .custom-modal-icon-error { font-size: 4rem; color: #e74c3c; margin-bottom: 15px; }
        .btn-red { background-color: #ffcccc; border: none; color: #d32f2f; padding: 10px 40px; border-radius: 30px; font-weight: bold; transition: all 0.2s; }
        .btn-red:hover { background-color: #f8d7da; }

        @media (max-width: 600px) {
            /* レスポンシブCSS (中略) */
            .login-wrapper { padding: 16px 0; min-height: 100vh; }
            .login-card { width: 100%; max-width: 80vw; margin: 24px auto 0 auto; padding: 18px 10px 24px 10px; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="app-title">習慣樹 -Habitree-</div>

    <div class="login-card">
        <h2>パスワードをお忘れですか？</h2>
        <p class="instruction-text">登録済みのメールアドレスを入力してください。<br>パスワード再設定用のリンクをお送りします。</p>
        
        <form id="resetRequestForm" method="POST" action="">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">メールアドレス</label>
                <input type="email" name="email" class="form-control" required placeholder="example@habitree.com" value="{{ form.email.value|default:'' }}">
                
                {% if form.email.errors %}
                    <div class="text-danger small mt-1">{{ form.email.errors }}</div>
                {% endif %}
            </div>

            <div class="btn-submit-container">
                <button type="submit" class="btn-green">送信する</button>
            </div>
        </form>

        <a href="{% url 'login' %}" class="back-link">ログイン画面に戻る</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
