{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードリセット - Habitree</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html {
            height: 100%;
        }

        body {
            background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)), 
                        url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            min-height: 95dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            padding: 20px;
        }

        .login-wrapper {
            text-align: center;
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #013c00;
            margin-bottom: 25px;
            letter-spacing: 0.05rem;
            line-height: 1.2;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: #333;
        }

        .instruction-text {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.6;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: block;
            color: #444;
            padding-left: 4px;
        }

        .form-control {
            background-color: #f2f2f2;
            border: 2px solid transparent;
            border-radius: 12px;
            height: 48px;
            font-size: 16px; /* 自動ズーム防止 */
            transition: all 0.2s;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: #c4e89b;
            box-shadow: none;
            outline: none;
        }

        .btn-green {
            background-color: #76b852;
            border: none;
            color: #fff;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-green:hover {
            background-color: #5a9e3a;
            color: #fff;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .app-title { font-size: 1.8rem; }
            .login-card { padding: 30px 20px; }
            .instruction-text { font-size: 0.85rem; }
        }

        @media (hover: none) {
            .btn-green:active {
                transform: scale(0.98);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="app-title">習慣樹 -Habitree-</div>

    <div class="login-card">
        <h2>パスワード再設定</h2>
        <p class="instruction-text">
            登録済みのメールアドレスを入力してください。<br>
            再設定用のリンクをお送りします。<br>
            <br>
            ※登録がある場合のみ、メールが届きます
        </p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">メールアドレス</label>
                <input type="email" name="email" class="form-control" required placeholder="example@habitree.com">
            </div>

            <div class="btn-submit-container">
                <button type="submit" class="btn-green">送信する</button>
            </div>
        </form>

        <a href="{% url 'users:login_page' %}" class="back-link">← ログイン画面に戻る</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
