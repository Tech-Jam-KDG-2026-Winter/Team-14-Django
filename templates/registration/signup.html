{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - Habitree</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        html {
            height: 100%;
        }

        body {
            background: linear-gradient(
                rgba(255, 255, 255, 0.5), 
                rgba(255, 255, 255, 0.5)
            ), 
            url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") 
            no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            min-height: 95dvh; /* スマホ用 */
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            padding: 20px; /* 余白を確保 */
        }

        .login-wrapper {
            text-align: center;
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #013c00;
            margin-bottom: 25px;
            letter-spacing: 0.05rem;
            line-height: 1.2;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 20px; /* ようこそ画面に合わせる */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-label {
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: block;
            color: #444;
            padding-left: 4px;
        }

        .form-control {
            background-color: #f2f2f2;
            border: 2px solid transparent;
            border-radius: 12px; /* 少し丸みを帯びさせる */
            height: 48px; /* タップしやすく高く */
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: #c4e89b;
            box-shadow: none;
        }

        .error-message {
            color: #d9534f;
            font-size: 0.75rem;
            margin-top: 5px;
            display: none;
            font-weight: bold;
            padding-left: 4px;
        }

        .btn-submit-container {
            margin-top: 25px;
        }

        .btn-habitree {
            background-color: #76b852; /* メインカラーに変更 */
            border: none;
            color: #fff;
            width: 100%; /* スマホでは全幅が押しやすい */
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-habitree:hover {
            background-color: #5a9e3a;
            color: #fff;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            font-size: 0.9rem;
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #333;
        }

        /* モバイル最適化 */
        @media (max-width: 480px) {
            .app-title {
                font-size: 1.8rem;
            }
            .login-card {
                padding: 30px 20px;
            }
            .form-control {
                height: 45px;
                font-size: 16px; /* iPhoneでのズーム防止 */
            }
        }

        @media (hover: none) {
            .btn-habitree:active {
                transform: scale(0.98);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="app-title">習慣樹 -Habitree-</div>
    
    <div class="login-card">
        <h2>新規登録</h2>
        
        <form id="signup-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">ユーザー名</label>
                <input type="text" name="username" class="form-control" placeholder="例: 山田太郎" required>
                <div id="error-username" class="error-message"></div>
            </div>

            <div class="form-group">
                <label class="form-label">メールアドレス</label>
                <input type="email" name="email" class="form-control" placeholder="example@mail.com" required>
                <div id="error-email" class="error-message"></div>
            </div>

            <div class="form-group">
                <label class="form-label">パスワード</label>
                <input type="password" name="password" class="form-control" required>
                <div id="error-password" class="error-message"></div>
            </div>

            <div class="form-group">
                <label class="form-label">パスワード（確認）</label>
                <input type="password" name="password_confirm" class="form-control" required>
                <div id="error-password_confirm" class="error-message"></div>
            </div>

            <div class="btn-submit-container">
                <button type="submit" class="btn-habitree">
                    登録する
                </button>
            </div>
        </form>

        <a href="{% url 'users:outer_home' %}" class="back-link">
            ← 戻る
        </a>
    </div>
</div>

<script>
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // 以前のエラー表示をクリア
        document.querySelectorAll('.error-message').forEach(el => {
            el.textContent = '';
            el.style.display = 'none';
        });

        const formData = new FormData(this);
        
        try {
            const response = await fetch("{% url 'users:signup' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            });

            const result = await response.json();

            if (response.ok) {
                window.location.href = "{% url 'users:signup_success' %}";
            } else {
                for (const [key, messages] of Object.entries(result)) {
                    const errorDiv = document.getElementById(`error-${key}`);
                    if (errorDiv) {
                        errorDiv.textContent = Array.isArray(messages) ? messages[0] : messages;
                        errorDiv.style.display = 'block';
                    }
                }
            }
        } catch (error) {
            alert("通信中にエラーが発生しました。");
        }
    });
</script>

</body>
</html>
