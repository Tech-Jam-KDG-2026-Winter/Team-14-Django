{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク選択 - Habitree</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html {
            height: 100%;
        }

        body {
            background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)), 
                        url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            min-height: 95dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            padding: 20px;
        }

        .wrapper {
            text-align: center;
            width: 100%;
            max-width: 450px;
            margin: auto;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #013c00;
            margin-bottom: 25px;
            letter-spacing: 0.05rem;
            line-height: 1.2;
        }

        .selection-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 35px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .selection-card h2 {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* 個別タスクカード */
        .task-item {
            background-color: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .task-item.selected {
            background-color: #fff;
            border-color: #76b852;
            box-shadow: 0 4px 15px rgba(118, 184, 82, 0.2);
        }

        /* 選択時のチェックマーク表示 */
        .task-item.selected::after {
            content: '✓';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #76b852;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .task-icon {
            font-size: 1.8rem;
            margin-right: 15px;
            background: white;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .task-info {
            flex: 1;
            padding-right: 20px;
        }

        .task-info h5 {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #222;
        }

        .task-info p {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0;
            line-height: 1.4;
        }

        /* 送信ボタン */
        .btn-confirm {
            background-color: #76b852;
            border: none;
            color: #fff;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.05rem;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-confirm:hover {
            background-color: #5a9e3a;
            color: #fff;
        }

        .refresh-link {
            display: inline-block;
            margin-top: 20px;
            color: #4da11f;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* モバイル対応 */
        @media (max-width: 480px) {
            .app-title { font-size: 1.8rem; }
            .selection-card { padding: 30px 15px; }
            .task-icon { font-size: 1.5rem; width: 45px; height: 45px; }
            .task-info h5 { font-size: 0.95rem; }
        }

        @media (hover: none) {
            .task-item:active {
                transform: scale(0.98);
                background-color: #eef5e9;
            }
            .btn-confirm:active {
                transform: scale(0.98);
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="app-title">習慣樹 -Habitree-</div>

    <div class="selection-card">
        <h2>育てる習慣を選ぶ</h2>
        <p class="subtitle">
            今週挑戦する習慣を1つ選んでください。<br>
            達成するほど、あなたの木は成長します。
        </p>
        
        <form id="task-form" method="POST" action="{% url 'users:task_select' %}">
            {% csrf_token %}
            
            {% for task in tasks %}
            <div class="task-item" onclick="selectTask(this)">
                <div class="task-icon">🌳</div>
                <div class="task-info">
                    <h5>{{ task.title }}</h5>
                    <p>{{ task.description|default:"この目標を1週間継続しましょう。" }}</p>
                </div>
                <input type="radio" name="task_choice" value="{{ task.id }}" class="d-none">
            </div>
            {% empty %}
            <p class="text-muted">タスクを準備中です...</p>
            {% endfor %}

            {% if tasks %}
            <button type="submit" class="btn btn-confirm">この習慣で木を育てる</button>
            {% endif %}
        </form>

        <a href="javascript:location.reload();" class="refresh-link">
            他の候補を表示する
        </a>
    </div>
</div>

<script>
    function selectTask(element) {
        document.querySelectorAll('.task-item').forEach(item => {
            item.classList.remove('selected');
        });
        element.classList.add('selected');
        const radio = element.querySelector('input[type="radio"]');
        if (radio) {
            radio.checked = true;
        }
    }

    const taskForm = document.getElementById('task-form');
    if (taskForm) {
        taskForm.onsubmit = function(e) {
            const selected = document.querySelector('input[name="task_choice"]:checked');
            if (!selected) {
                e.preventDefault();
                alert('今週育てる習慣が選ばれていません。\nリストの中から1つ選んでください！');
                return false;
            }
        };
    }
</script>

</body>
</html>
