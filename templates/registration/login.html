{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - Habitree</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html {
            height: 100%;
        }

        body {
            background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)), 
                        url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            min-height: 95dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            padding: 20px;
        }

        .login-wrapper {
            text-align: center;
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #013c00;
            margin-bottom: 25px;
            letter-spacing: 0.05rem;
            line-height: 1.2;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: block;
            color: #444;
            padding-left: 4px;
        }

        .form-control {
            background-color: #f2f2f2;
            border: 2px solid transparent;
            border-radius: 12px;
            height: 48px;
            font-size: 16px; /* スマホの自動ズーム防止 */
            transition: all 0.2s;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: #c4e89b;
            box-shadow: none;
            outline: none;
        }

        .btn-submit-container {
            margin-top: 25px;
        }

        .btn-login {
            background-color: #76b852; /* 新規登録と同じメイン緑 */
            border: none;
            color: #fff;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background-color: #5a9e3a;
            color: #fff;
        }

        .forgot-password-link {
            color: #4da11f;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: color 0.2s;
            display: inline-block;
            margin-top: 15px;
        }

        .forgot-password-link:hover {
            color: #206001;
            text-decoration: underline;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            font-size: 0.9rem;
            color: #666;
            text-decoration: none;
        }

        /* モバイル最適化 */
        @media (max-width: 480px) {
            .app-title {
                font-size: 1.8rem;
            }
            .login-card {
                padding: 30px 20px;
            }
        }

        @media (hover: none) {
            .btn-login:active {
                transform: scale(0.98);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="app-title">習慣樹 -Habitree-</div>

    <div class="login-card">
        <h2>ログイン</h2>
        
        {% if form.errors %}
            <div class="alert alert-danger" style="font-size: 0.8rem; padding: 10px; border-radius: 10px;">
                ユーザー名またはパスワードが正しくありません。
            </div>
        {% endif %}
        
        <form id="login-form" method="POST" action="{% url 'users:login_page' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">ユーザー名</label>
                <input type="text" name="username" class="form-control" placeholder="ユーザー名を入力" required>
            </div>

            <div class="form-group">
                <label class="form-label">パスワード</label>
                <input type="password" name="password" class="form-control" placeholder="パスワードを入力" required>
            </div>

            <div class="btn-submit-container">
                <button type="submit" class="btn btn-login">ログイン</button>
            </div>
        </form>

        <div style="text-align: center;">
            <a href="{% url 'users:password_reset' %}" class="forgot-password-link">
                パスワードをお忘れの方はこちら
            </a>
        </div>
        
        <a href="{% url 'users:outer_home' %}" class="back-link">← 戻る</a>
    </div>
</div>

</body>
</html>
