{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - Habitree</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html {
            height: 100%;
        }

        body {
            background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)), 
                        url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            min-height: 95dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            padding: 20px;
        }

        .login-wrapper {
            text-align: center;
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #013c00;
            margin-bottom: 25px;
            letter-spacing: 0.05rem;
            line-height: 1.2;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: block;
            color: #444;
            padding-left: 4px;
        }

        .form-control {
            background-color: #f2f2f2;
            border: 2px solid transparent;
            border-radius: 12px;
            height: 48px;
            font-size: 16px; /* iPhoneでのズーム防止 */
            transition: all 0.2s;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: #c4e89b;
            box-shadow: none;
            outline: none;
        }

        .btn-green {
            background-color: #76b852; /* メインの緑に統一 */
            border: none;
            color: #fff;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-green:hover {
            background-color: #5a9e3a;
            color: #fff;
        }

        /* リンク無効時のスタイル */
        .error-container {
            padding: 20px 0;
        }

        .error-text {
            font-size: 0.95rem;
            color: #d9534f;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-retry {
            background-color: #6c757d;
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 0.9rem;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .btn-retry:hover {
            background-color: #5a6268;
            color: #fff;
        }

        @media (max-width: 480px) {
            .app-title { font-size: 1.8rem; }
            .login-card { padding: 30px 20px; }
        }

        @media (hover: none) {
            .btn-green:active {
                transform: scale(0.98);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="app-title">習慣樹 -Habitree-</div>

    <div class="login-card">
        <h2>新しいパスワード</h2>
        
        {% if validlink %}
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label">新しいパスワード</label>
                    <input type="password" name="new_password1" class="form-control" required placeholder="8文字以上">
                </div>

                <div class="form-group">
                    <label class="form-label">新しいパスワード（確認用）</label>
                    <input type="password" name="new_password2" class="form-control" required placeholder="もう一度入力">
                </div>

                <div class="btn-submit-container">
                    <button type="submit" class="btn-green">パスワードを更新</button>
                </div>
            </form>
        {% else %}
            <div class="error-container">
                <span class="material-symbols-outlined" style="font-size: 3rem; color: #d9534f; margin-bottom: 15px;">error</span>
                <p class="error-text">
                    このリンクは無効か、<br>
                    有効期限が切れています。
                </p>
                <a href="{% url 'users:password_reset' %}" class="btn-retry">リセットを再試行</a>
            </div>
        {% endif %}
    </div>
</div>

</body>
</html>
