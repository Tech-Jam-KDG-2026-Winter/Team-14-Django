{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録完了 - Habitree</title>
    
    <link rel="stylesheet" 
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(
                rgba(255, 255, 255, 0.5), 
                rgba(255, 255, 255, 0.5)
            ), 
            url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") 
            no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .custom-modal-icon {
            font-size: 5rem;
            color: #76b852;
            margin-bottom: 20px;
            /* ふわっと浮き出るアニメーション */
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #013c00;
            margin-bottom: 20px;
        }

        .instruction-text {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-green {
            background-color: #c4e89b;
            border: none;
            color: #000;
            padding: 12px 40px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn-green:hover {
            background-color: #fff;
            box-shadow: 0 0 0 2px #a2d572 inset;
            color: #000;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="custom-modal-icon">
        <span class="material-symbols-outlined" style="font-size: inherit;">
            park
        </span>
    </div>
    
    <h2 class="success-title">ようこそ、習慣樹へ！</h2>
    
    <p class="instruction-text">
        アカウントの作成が完了しました。<br>
        これから一緒に素敵な習慣を育てましょう。
    </p>
    
    <a href="{% url 'users:login_page' %}" class="btn-green">
        ログインして始める
    </a>
</div>

</body>
</html>
