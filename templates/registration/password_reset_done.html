{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メール送信完了 - Habitree</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(255, 255, 255, 0.500), rgba(255, 255, 255, 0.500)), 
                        url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }

        .login-wrapper {
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        .app-title {
            font-size: 2.8rem;
            font-weight: bold;
            color: #013c00;
            margin-bottom: 20px;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .custom-modal-icon {
            font-size: 4rem;
            color: #76b852;
            margin-bottom: 20px;
        }

        .success-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .instruction-text {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-green {
            background-color: #c4e89b;
            border: none;
            color: #000;
            padding: 12px 40px;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-green:hover {
            background-color: #fff;
            box-shadow: 0 0 0 2px #a2d572 inset;
            color: #000;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="app-title">習慣樹 -Habitree-</div>

    <div class="login-card">
        <div class="custom-modal-icon">
            <span class="material-symbols-outlined" style="font-size: inherit;">check_circle</span>
        </div>
        
        <h2 class="success-title">メールを送信しました</h2>
        
        <p class="instruction-text">
            ご入力いただいたメールアドレス宛に、<br>
            パスワード再設定用のリンクをお送りしました。<br>
            メール内のリンクから手続きを完了させてください。
        </p>
        
        <a href="{% url 'users:login_page' %}" class="btn-green">OK</a>
    </div>
</div>

</body>
</html>
