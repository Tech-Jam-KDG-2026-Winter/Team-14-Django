{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メール送信完了 - Habitree</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html {
            height: 100%;
        }

        body {
            background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)), 
                        url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            min-height: 95dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            padding: 20px;
        }

        .login-wrapper {
            text-align: center;
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #013c00;
            margin-bottom: 25px;
            letter-spacing: 0.05rem;
            line-height: 1.2;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .custom-modal-icon {
            font-size: 5rem;
            color: #76b852;
            margin-bottom: 20px;
            /* 完了を強調するフェードインアニメーション */
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .success-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .instruction-text {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 35px;
            line-height: 1.7;
            text-align: center;
        }

        .btn-green {
            background-color: #76b852; /* メインの緑に統一 */
            border: none;
            color: #fff;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.05rem;
            text-decoration: none;
            display: block; /* 全幅で押しやすく */
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(118, 184, 82, 0.2);
        }

        .btn-green:hover {
            background-color: #5a9e3a;
            color: #fff;
        }

        @media (max-width: 480px) {
            .app-title { font-size: 1.8rem; }
            .login-card { padding: 40px 20px; }
            .success-title { font-size: 1.3rem; }
        }

        @media (hover: none) {
            .btn-green:active {
                transform: scale(0.98);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="app-title">習慣樹 -Habitree-</div>

    <div class="login-card">
        <div class="custom-modal-icon">
            <span class="material-symbols-outlined" style="font-size: inherit; display: block;">check_circle</span>
        </div>
        
        <h2 class="success-title">メールを送信しました</h2>
        
        <p class="instruction-text">
            ご入力いただいたアドレス宛に、<br>
            再設定用のリンクをお送りしました。<br>
            <span style="font-size: 0.85rem; color: #888;">※届かない場合は迷惑メールフォルダを<br>ご確認ください。</span>
        </p>
        
        <a href="{% url 'users:login_page' %}" class="btn-green">OK</a>
    </div>
</div>

</body>
</html>
