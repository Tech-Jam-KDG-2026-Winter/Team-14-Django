{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ようこそ - Habitree</title>
    <style>
        html {
            height: 100%;
        }
        
        body {
            background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)), 
                        url("{% static 'img/59243d66ca4808fde41263b6f1c15d4a0ba57fe2.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            min-height: 95dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            padding: 20px;
            overflow: hidden;
        }

        .home-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            margin: auto;
        }

        .logo-area {
            margin-bottom: 20px;
        }

        .brand-name {
            font-size: 2.5rem;
            font-weight: bold;
            color: #76b852;
            margin-bottom: 8px;
            display: block;
            line-height: 1.2;
        }

        .welcome-message {
            font-size: 1rem;
            color: #555;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-habitree {
            padding: 14px 30px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            transition: all 0.3s;
            border: none;
            font-size: 1rem;
            will-change: transform;
        }

        .btn-signup {
            background-color: #76b852;
            color: #fff;
        }

        .btn-signup:hover {
            background-color: #5a9e3a;
            color: #fff;
        }

        .btn-login {
            background-color: #c4e89b;
            color: #000;
        }

        .btn-login:hover {
            background-color: #fff;
            box-shadow: 0 0 0 2px #a2d572 inset;
            color: #000;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .home-card {
                padding: 35px 25px;
                border-radius: 15px;
            }

            .brand-name {
                font-size: 2rem;
            }

            .welcome-message {
                font-size: 0.95rem;
                margin-bottom: 30px;
            }

            .btn-habitree {
                padding: 12px 25px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 360px) {
            .home-card {
                padding: 30px 20px;
            }

            .brand-name {
                font-size: 1.8rem;
            }

            .welcome-message {
                font-size: 0.9rem;
            }

            .btn-habitree {
                padding: 11px 20px;
                font-size: 0.9rem;
            }
        }

        @media (hover: none) {
            .btn-signup:active {
                transform: scale(0.98);
                background-color: #5a9e3a;
            }

            .btn-login:active {
                transform: scale(0.98);
                background-color: #fff;
                box-shadow: 0 0 0 2px #a2d572 inset;
            }
        }
    </style>
</head>
<body>

<div class="home-card">
    <div class="logo-area">
        <span class="brand-name">習慣樹</span>
        <span class="brand-name">-Habitree-</span>
    </div>
    
    <p class="welcome-message">
        あなたの習慣を育てて、<br>
        豊かな森を作りましょう。
    </p>
    
    <div class="button-group">
        <a href="{% url 'users:signup_page' %}" class="btn-habitree btn-signup">新規登録する</a>
        <a href="{% url 'users:login_page' %}" class="btn-habitree btn-login">ログイン</a>
    </div>
</div>

</body>
</html>
