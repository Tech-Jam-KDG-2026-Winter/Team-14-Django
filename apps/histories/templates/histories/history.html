<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>歩数履歴グラフ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; }
        .container { width: 80%; max-width: 800px; margin-top: 50px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚶‍♂️ 今週の歩数履歴</h1>
        <canvas id="stepChart"></canvas>
    </div>

    <script>
        // さっき成功したAPIからデータを取ってくる
        fetch('/api/history/')
            .then(response => response.json())
            .then(data => {
                const labels = data.map(item => item.date);
                const steps = data.map(item => item.steps);

                const ctx = document.getElementById('stepChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar', // 棒グラフ
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '歩数',
                            data: steps,
                            backgroundColor: 'rgba(54, 162, 235, 0.6)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: { y: { beginAtZero: true } }
                    }
                });
            });
    </script>
</body>
</html>
